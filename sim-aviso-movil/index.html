<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviso de envío — simulación</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&display=swap" rel="stylesheet">
<!--
  Simulación del pendiente 6: el aviso de envío (comp-mwpi68gn) en la cabecera de sandara.pe.
  Reproduce la maqueta de Wix medida en sandara.pe el 20-nov-2026:
   - Móvil: Wix maqueta a 320 px y lo escala al ancho del teléfono (390 px → ×1.22).
     Cabecera de 77 px; el aviso es una caja de texto de 300 × 36 px en x=10, y=58.
     El texto ocupa 2 líneas y la 2.ª (desde «Provincias») queda bajo la portada.
   - Escritorio: barra negra a todo el ancho (ya publicada con intuitivo.js).
  El CSS de cada variante usa los mismos selectores que intuitivo.js para poder copiarlo tal cual.
-->
<style>
:root{--fondo:#faf8f0;--negro:#0a0a0a;--sans:"Nunito Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html{overflow-x:hidden}/* como Wix: la barra de 100vw no genera desplazamiento lateral */
body{margin:0;background:var(--fondo);color:var(--negro);font:300 14px/1.5 var(--sans)}
img{display:block;max-width:100%}

/* ---------- Maqueta de la cabecera de Wix ---------- */
/* Escritorio */
#SITE_HEADER{position:relative;height:159px;background:var(--fondo)}
.cab{max-width:980px;margin:0 auto;position:relative;height:100%}
.logo{position:absolute;left:50%;top:40px;transform:translateX(-50%);height:40px;filter:invert(1)}
.ico{position:absolute;top:44px;width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.5}
.ico.menu{left:20px}.ico.bolsa{right:20px}
#comp-mwpi68gn{position:absolute;left:0;top:131px;width:980px;text-align:center}
#comp-mwpi68gn p{margin:0;font-size:14px;line-height:1.3em}
.portada{position:relative;z-index:1;background:var(--fondo)}
.portada img{width:100%;height:460px;object-fit:cover}
.portada .txt{padding:16px 20px 60px}

/* Móvil: maqueta de 320 px escalada como hace Wix */
@media (max-width:600px){
  body{width:320px;zoom:calc(100vw / 320px)}
  #SITE_HEADER{height:77px}
  .cab{max-width:none;width:320px}
  .logo{top:15px;height:31px}
  .ico{top:12px;width:30px;height:30px}.ico.menu{left:12px}.ico.bolsa{right:15px}
  #comp-mwpi68gn{left:10px;top:58px;width:300px}
  .portada img{height:380px}
}

/* ---------- Ya publicado: barra negra solo en escritorio (intuitivo.js) ---------- */
@media(min-width:601px){#comp-mwpi68gn{position:absolute}#comp-mwpi68gn::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:#0a0a0a;z-index:0}#comp-mwpi68gn *{position:relative;z-index:1;color:#fff!important;letter-spacing:.06em}}

/* ---------- Variante A: barra negra en móvil, texto corto en una línea ---------- */
@media(max-width:600px){
  .v-a #comp-mwpi68gn::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:#0a0a0a;z-index:0}
  .v-a #comp-mwpi68gn *{position:relative;z-index:1;color:#fff!important;font-size:11px!important;line-height:19px!important;letter-spacing:.04em;white-space:nowrap}
}

/* ---------- Variante B: barra negra en móvil, texto completo en dos líneas ---------- */
@media(max-width:600px){
  /* En sandara.pe la portada se monta ~17 px sobre la cabecera: por eso la cabecera sube de capa. */
  .v-b #SITE_HEADER{position:relative;z-index:50}
  .v-b #comp-mwpi68gn{transform:translateY(-8px)}
  .v-b #comp-mwpi68gn::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:#0a0a0a;z-index:0}
  .v-b #comp-mwpi68gn *{position:relative;z-index:1;color:#fff!important;font-size:10px!important;line-height:13.5px!important;letter-spacing:.04em}
}

/* ---------- Selector de la simulación ---------- */
.sim{position:fixed;left:8px;right:8px;bottom:8px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font:400 12px/1 var(--sans);zoom:1}
.sim button{font:inherit;min-height:36px;padding:0 12px;border:1px solid var(--negro);background:#fff;color:var(--negro);cursor:pointer}
.sim button[aria-pressed="true"]{background:var(--negro);color:#fff}
.sim span{flex-basis:100%;text-align:center;color:#5a5a5a;font-size:11px}
@media (max-width:600px){.sim{left:4px;right:4px;bottom:4px;font-size:10px}.sim button{min-height:30px;padding:0 8px}}
</style>
</head>
<body class="v-actual">
<header id="SITE_HEADER"><div class="cab">
  <svg class="ico menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  <img class="logo" src="../sim-intuitivo/img/logo-blanco.png" alt="Sandara">
  <svg class="ico bolsa" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
  <!-- Misma estructura que el texto enriquecido de Wix -->
  <div id="comp-mwpi68gn" class="wixui-rich-text"><p class="font_2"><span><span class="sdr-sans">Envío gratis desde S/ 300 · Lima S/ 8 · Provincias S/ 20 · Paga con Yape o Plin</span></span></p></div>
</div></header>

<section class="portada">
  <img src="../sim-intuitivo/img/empaque.jpg" alt="">
  <div class="txt">Portada (imagen de relleno; el video no está en el repositorio).</div>
</section>

<div class="sim" role="group" aria-label="Variante del aviso">
  <button data-v="v-actual" aria-pressed="true">Actual</button>
  <button data-v="v-a" aria-pressed="false">A · una línea</button>
  <button data-v="v-b" aria-pressed="false">B · dos líneas</button>
  <span>Simulación local · no es el sitio publicado</span>
</div>

<script>
/* Mismo cambio de texto que haría intuitivo.js en móvil (variante A). */
var LARGO = 'Envío gratis desde S/ 300 · Lima S/ 8 · Provincias S/ 20 · Paga con Yape o Plin';
var CORTO = 'Envío gratis desde S/ 300 · Yape y Plin';
var hoja = document.querySelector('#comp-mwpi68gn .sdr-sans');
function aplicar(v){
  document.body.className = v;
  document.querySelectorAll('.sim button').forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.v === v))});
  var movil = matchMedia('(max-width:600px)').matches;
  hoja.textContent = (v === 'v-a' && movil) ? CORTO : LARGO;
}
document.querySelectorAll('.sim button').forEach(function(b){b.addEventListener('click', function(){aplicar(b.dataset.v)})});
var q = new URLSearchParams(location.search).get('v'); if (q) aplicar(q);
matchMedia('(max-width:600px)').addEventListener('change', function(){aplicar(document.body.className)});
</script>
</body>
</html>
