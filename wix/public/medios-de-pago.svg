<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 44" width="640" height="44" role="img" aria-label="Medios de pago: Visa, Mastercard, American Express, Diners Club, Yape y Plin">
  <g fill="#0A0A0A" font-family="Arial, Helvetica, sans-serif">
    <!-- Visa -->
    <text x="0" y="30" font-size="25" font-weight="900" font-style="italic" letter-spacing="0.5">VISA</text>
    <!-- Mastercard -->
    <g transform="translate(104 8)">
      <circle cx="12" cy="12" r="12"/>
      <circle cx="26" cy="12" r="12" fill="none" stroke="#0A0A0A" stroke-width="2.2"/>
      <text x="19" y="34" font-size="5.5" text-anchor="middle" letter-spacing="0.2">mastercard</text>
    </g>
    <!-- American Express -->
    <g transform="translate(182 0)">
      <text x="0" y="20" font-size="12" font-weight="900" letter-spacing="0.3">AMERICAN</text>
      <text x="6" y="33" font-size="12" font-weight="900" letter-spacing="0.6">EXPRESS</text>
    </g>
    <!-- Diners Club -->
    <g transform="translate(292 8)">
      <circle cx="13" cy="14" r="13" fill="none" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M9 7v14M17 7v14" stroke="#0A0A0A" stroke-width="2" fill="none"/>
      <text x="33" y="15" font-size="12" font-family="Georgia, serif">Diners Club</text>
      <text x="33" y="25" font-size="6" letter-spacing="0.8">INTERNATIONAL</text>
    </g>
    <!-- Yape (icono de app en una tinta) -->
    <g transform="translate(436 2)">
      <rect x="0" y="0" width="40" height="40" rx="10"/>
      <text x="20" y="25" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.3">yape</text>
      <text x="48" y="27" font-size="17" font-weight="700" letter-spacing="-0.3">Yape</text>
    </g>
    <!-- Plin (icono de app en una tinta) -->
    <g transform="translate(544 2)">
      <rect x="0" y="0" width="40" height="40" rx="10"/>
      <text x="20" y="25" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.3">plin</text>
      <text x="48" y="27" font-size="17" font-weight="700" letter-spacing="-0.3">Plin</text>
    </g>
  </g>
</svg>
