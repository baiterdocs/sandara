<script>
(() => {
const collections = [
{
anchor: 'plata', section: 'comp-msqq7p0y', name: 'Plata peruana',
detail: 'Piezas en plata 950 y 925.', count: '16 piezas · desde S/ 40',
photo: '6720f3_90eac0bf6a6e44f2a0333ddbb304f91c~mv2.jpg',
},
{
anchor: 'acero', section: 'comp-ms9mrug6', name: 'Acero hipoalergénico',
detail: 'Doble enchape de oro de 18 kilates.', count: '154 piezas · S/ 25',
photo: '6720f3_3719d22b3142410c9cbc80edf60e67e2~mv2.jpg',
},
{
anchor: 'atelier', section: 'comp-mwp6vxje', name: 'Atelier',
detail: 'Piedras naturales y técnicas artesanales. Handmade in Cusco.', count: '6 piezas · desde S/ 80',
photo: '6720f3_06bb47ffcc184c118f6a178aeefc207a~mv2.jpg',
},
];
const byId = id => document.getElementById(id);
function makeElement(tag, className, text) {
const element = document.createElement(tag);
if (className) element.className = className;
if (text) element.textContent = text;
return element;
}
function linkToSection(link, anchor) {
link.href = '#' + anchor;
link.addEventListener('click', event => {
if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
const target = byId(anchor)?.parentElement;
if (!target) return;
event.preventDefault();
target.focus({ preventScroll: true });
target.scrollIntoView({ block: 'start' });
});
}
function renderCollections(hero, sections) {
const navigation = makeElement('nav');
navigation.id = 'sdr-colecciones';
navigation.setAttribute('aria-labelledby', 'sdr-colecciones-titulo');
const heading = makeElement('h2', '', 'Colecciones');
heading.id = 'sdr-colecciones-titulo';
const cards = makeElement('div', 'sdr-tarjetas');
for (const collection of collections) {
const link = makeElement('a', 'sdr-tarjeta');
linkToSection(link, collection.anchor);
const image = makeElement('img');
image.alt = '';
image.loading = 'lazy';
image.src = 'https://static.wixstatic.com/media/' + collection.photo
+ '/v1/fill/w_640,h_760,al_c,q_82/coleccion.jpg';
link.append(image, makeElement('span', '', collection.count),
makeElement('h3', '', collection.name), makeElement('p', '', collection.detail));
cards.append(link);
}
navigation.append(heading, cards);
hero.after(navigation);
sections.forEach((section, index) => {
const anchor = makeElement('span', 'sdr-ancla');
anchor.id = collections[index].anchor;
anchor.setAttribute('aria-hidden', 'true');
section.prepend(anchor);
});
}
function renderHeroLink() {
const slot = document.querySelector('[data-mesh-id="comp-mwd99itninlineContent-gridContainer"]');
if (!slot || slot.querySelector('.sdr-portada-enlace')) return;
const cta = makeElement('a', 'sdr-portada-enlace', 'Comprar plata peruana');
linkToSection(cta, 'plata');
const arrow = makeElement('span', '', ' →');
arrow.setAttribute('aria-hidden', 'true');
cta.append(arrow);
slot.append(cta);
const title = byId('comp-mwd9b83z')?.querySelector('h1');
if (title) {
const walker = document.createTreeWalker(title, NodeFilter.SHOW_TEXT);
while (walker.nextNode()) {
const text = walker.currentNode;
text.data = text.data.replace(/\s+[-–—]\s*$/, '');
}
}
}
function renderHome() {
const hero = byId('comp-ms9uebtn');
if (!hero || byId('sdr-colecciones')) return;
const home = hero.parentElement;
const sections = collections.map(collection => byId(collection.section));
if (!sections.every(section => section?.parentElement === home)) return;
renderCollections(hero, sections);
renderHeroLink();
const target = byId(location.hash.slice(1));
if (target?.classList.contains('sdr-ancla')) target.scrollIntoView();
}
let frame = 0;
function schedule() {
if (frame) return;
frame = requestAnimationFrame(() => {
frame = 0;
renderHome();
});
}
function start() {
schedule();
new MutationObserver(records => {
if (records.some(record => [...record.addedNodes].some(node =>
node.nodeType === 1 && (node.id === 'comp-ms9uebtn' || node.querySelector('#comp-ms9uebtn'))
))) schedule();
}).observe(document.body, { childList: true, subtree: true });
}
if (document.readyState === 'complete') setTimeout(start, 500);
else window.addEventListener('load', () => setTimeout(start, 500), { once: true });
})();
</script>
