<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portada — textos con la misma animación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3efe9;
    --ink: #1f1f1f;
    --dur: 900ms;               /* misma duración para los tres textos */
    --ease: cubic-bezier(.2, .6, .2, 1);
    --paso: 120ms;              /* escalonado único y corto (máximo 100-120 ms) */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #141414; --ink: #f3efe9; }
  }
  :root[data-theme="dark"] { --paper: #141414; --ink: #f3efe9; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }

  .portada {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 0 16px;
    background: #d9d4cc url("../work/hero/sandara-hero-horizontal.png") center / cover no-repeat;
  }
  .texto { margin-left: clamp(16px, 4vw, 56px); }

  /* Los tres textos comparten exactamente la misma animación. */
  .anima {
    opacity: 0;
    transform: translateY(14px);
    animation: entrada var(--dur) var(--ease) forwards;
  }
  .anima:nth-child(1) { animation-delay: 0ms; }
  .anima:nth-child(2) { animation-delay: var(--paso); }
  .anima:nth-child(3) { animation-delay: calc(var(--paso) * 2); }

  @keyframes entrada {
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    margin: 0 0 14px;
    font: 400 15px/1 "Jost", sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .linea {
    margin: 0;
    font: 400 clamp(34px, 4.6vw, 64px)/1.1 "Cormorant Garamond", serif;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .linea .sep { margin: 0 .35em; }
  .comprar {
    color: inherit;
    font: inherit;
    text-transform: none;
    letter-spacing: .01em;
    text-decoration: underline;
    text-underline-offset: .12em;
    text-decoration-thickness: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    .anima { animation: fundido 300ms linear forwards; transform: none; }
    .anima:nth-child(n) { animation-delay: 0ms; }
    @keyframes fundido { to { opacity: 1; } }
  }
  @media (max-width: 600px) {
    .linea { font-size: 34px; }
  }
</style>
</head>
<body>
<section class="portada">
  <div class="texto">
    <p class="eyebrow anima">Nueva colección</p>
    <h1 class="linea anima">Plata peruana<span class="sep">-</span><a class="comprar" href="#">Comprar ahora</a></h1>
  </div>
</section>
</body>
</html>
